defaults:
  - paths: default
  - search_space: medium
  - benchmark: forcing
  - representation: temporal_encoder
  - override hydra/sweeper: optuna_local
  - _self_

config_id: 0

experiment:
  name: ${oc.env:EXPERIMENT_NAME,experiment0}

tuning:
  n_trials: 50
  direction: minimize
  objective: best_val_mean

model:
  type: "2D FNO time-conditioned (temporal branch)"
  parameters:
    # Representational dims (in_channels, cond_static_dim, temporal_token_dim,
    # use_temporal_encoder, s_y_channel, use_forcing_time_aug) are resolved by
    # the ProblemSpec from the (benchmark, representation) pair, not set here.
    modes1: 16
    modes2: 16
    width: 64
    out_channels: 1
    n_layers: 4
    cond_hidden: 256
    temporal_samples: 64
    temporal_hidden: 128
    forcing_embed_dim: 64
    forcing_spatial_dim: 16       # K: learned spatial-forcing channels injected as s_y * z_a
    activation: "GELU"            # doc-only; FNO2d hardcodes GELU
    dropout: 0.0
    spectral_dropout: 0.0
    padding_reference_resolution: 100  # scale FNO pad cells with grid resolution; set = training grid (null = fixed pad=8)
    padding_mode: replicate       # boundary extension for the FNO domain pad: zeros|replicate|reflect
    cin_exclude_padding: true     # compute CIN instance stats over the unpadded region only
    hard_right_dirichlet: false   # overwrite right wall face with the fixed BC temperature (exact BC)
    hard_right_dirichlet_t_right: 300.0  # right-wall Dirichlet value in Kelvin (normalized at build time)

  # ---- CViT (PINO path) ----
  # Read ONLY by scripts/run_train_pino.py / src.operators.train_pino; the FNO
  # path never touches model.cvit, so these keys are additive and inert for it.
  # patch_size must divide the data grid (100 -> 10 or 20). fourier_freq is a
  # real hyperparameter (spectral bias of the coordinate embedding), not an
  # implementation detail. hard_right_dirichlet_t_right (Kelvin) is normalized
  # with the training (mu, sigma) at build time.
  cvit:
    in_ch: 1
    out_dim: 1
    emb_dim: 256
    dec_emb_dim: null            # null -> equals emb_dim
    patch_size: 10
    depth_enc: 4
    depth_dec: 2
    num_heads: 8
    mlp_ratio: 2.0
    fourier_freq: 1.0            # spatial (x, y in [0,1]) Fourier feature scale
    fourier_freq_t: null         # temporal (t in [0,t_final]) scale; null -> fourier_freq.
                                 # On the diffusion window t_final=0.3, freq 1.0 makes
                                 # fourier_t near-constant (time-blind decoder); ~5-10 fixes it.
    activation: gelu
    hard_right_dirichlet: true
    hard_right_dirichlet_t_right: 300.0

training:
  device: "auto"
  batch_size: 1024
  n_snapshots: 20
  n_snapshots_test: 40
  curriculum_warmup: 25
  epochs: 101
  learning_rate: 0.002
  weight_decay: 3.0e-5
  noise_std: 0.0
  grad_clip: 1.0
  scheduler:
    type: "RIGNOThreePhase"
    warmup_fraction: 0.02
    cosine_fraction: 0.88
    exp_fraction: 0.10
    init_lr_ratio: 0.05
    cosine_floor_lr_ratio: 0.05
    final_lr_ratio: 0.005
    # training.learning_rate remains the source of truth for the peak LR.
    # Ratio fields scale the schedule cleanly during Optuna sweeps.
    # StepLR params (used when type=StepLR):
    step_size: 50
    gamma: 0.5
  optimizer: "AdamW"
  # SOAP optimizer knobs (Vyas et al. 2024; used only when optimizer: "SOAP").
  # lr / weight_decay come from training.learning_rate / training.weight_decay.
  # Spectral weights are 5-D real tensors; per-dimension preconditioners handle
  # them (all dims << max_precond_dim). precondition_1d: false -> 1-D biases use
  # the Adam-style fallback. Needs a separate LR sweep (conf/search_space/soap.yaml).
  soap:
    betas: [0.95, 0.95]
    shampoo_beta: 0.95
    eps: 1.0e-8
    precondition_frequency: 10
    max_precond_dim: 10000
    merge_dims: false
    precondition_1d: false
  # training.loss.{interface_x, interface_half_width, interface_weight,
  # per_sample_interface_x} are owned by the active `benchmark` config group
  # (per-benchmark loss region). per_sample_interface_x defaults to false in code
  # (loss_cfg.get(...)) and is set true only for the interfaces benchmark.
  validate_every: 10
  # Cap on the number of per-pair diagnostic rows written to val_pairs.csv per
  # validation pass. A fixed, seeded subset of pairs is written (same subset
  # every pass, so per-pair error stays trackable across epochs). Does NOT affect
  # reported val_* metrics or checkpoint selection — only the diagnostic CSV.
  # null (or a value >= total pairs) writes every pair (legacy behavior).
  val_pairs_max_rows: 5000
  patience: 20
  # Validation metric used to select best_val / early-stopping. Allowed values:
  #   val_rel_l2    (default) normalized-space relative L2 — unchanged baseline
  #   val_nrmse     per-sample nRMSE headline (normalization-invariant)
  #   val_jump_nrmse normalized node-jump error (interface fidelity)
  #   val_rmse_K_lead_gt_tc  post-cutoff (tau > lead_cutoff_time) RMSE in Kelvin;
  #                          the long-lead adaptation objective. Requires
  #                          training.lead_cutoff_time to be set. Honors
  #                          checkpoint_forgetting_ratio (no-forgetting guard).
  # All are minimized; unknown values fall back to val_rel_l2.
  checkpoint_metric: "val_rel_l2"
  # Physical lead threshold tc (seconds) splitting val pairs into tau <= tc /
  # tau > tc for the pre/post-cutoff diagnostics and the val_rmse_K_lead_gt_tc
  # checkpoint metric. null disables the split (all pre/post columns stay blank).
  lead_cutoff_time: null
  # No-forgetting guard for checkpoint_metric=val_rmse_K_lead_gt_tc: only accept
  # an epoch whose pre-cutoff RMSE_K (tau <= tc) <= ratio * pre_cutoff_ref, where
  # pre_cutoff_ref is model A's pre-cutoff RMSE_K captured by the step-0 (pre-
  # finetune) validation pass. null disables the guard.
  checkpoint_forgetting_ratio: null
  # Weights-only warm-start. null = fresh init (or auto-resume of full state from
  # fno2d_latest.pt in the run dir, which is untouched). When set (and NOT auto-
  # resuming) load only model_state from this checkpoint; optimizer/scheduler/
  # epoch/best_val start fresh (peak LR = training.learning_rate). The
  # checkpoint's (mu_global, sigma_global) must equal the recomputed stats.
  init_from_checkpoint: null
  seeds: [42]
  # DataLoader workers per rank. `null` derives from SLURM_CPUS_PER_TASK /
  # world_size at runtime; set an int to override.
  num_workers: null
  # ---- PINO (physics-only) training ----
  # Read ONLY by src.operators.train_pino; inert for the FNO path. Loss is
  #   L = lambda_r*mean(r^2) + lambda_ic*mean(ic^2) + lambda_bc*mean(neumann^2).
  # n_r/n_ic/n_bc are collocation counts per step; sim_batch sims per step.
  # chunk_r splits the interior residual into gradient-accumulation chunks to cap
  # peak double-backward memory (0/null = no chunking).
  pino:
    lambda_r: 1.0
    lambda_ic: 1.0
    lambda_bc: 1.0
    n_r: 4096
    n_ic: 1024
    n_bc: 512
    sim_batch: 16
    chunk_r: 0
    alpha: 1.0
    # ic_loss selects the IC term norm. "mse" (legacy) is the raw normalized MSE
    # mean(ic^2), which goes numerically small on a near-300 K field even when the
    # relative error in the thermal signal is large (t0 rel-L2 ~0.75 seeds the whole
    # trajectory). "rel" is the per-sim relative L2 vs the constant-300 K deviation,
    # sum_i ic^2 / (sum_i (ic_target - t_right_tilde)^2 + ic_eps), targeting the same
    # signal the validation rel-L2 measures. ic_eps guards the denominator.
    ic_loss: mse
    ic_eps: 1.0e-6
    # dense_ic anchors the IC loss on EVERY grid node (Nx*Ny points, no RNG draw)
    # instead of n_ic random nodes -- the primary stabilizer for this benchmark,
    # whose physics attractor is the constant field (Chen et al. arXiv:2606.06164).
    # false keeps the legacy n_ic random-node draw byte-identical.
    dense_ic: false
    # resample_every redraws the interior/wall collocation only every N steps
    # (IC targets are re-read every step as the sim minibatch rotates). Slower
    # resampling lets the IC anchor settle during warm-up; 1 = per-step (legacy).
    resample_every: 1
    # diag_time_bins is the number of query-time bins for the residual-per-time-bin
    # diagnostic when causal weighting is off (causal.n_bins is used when it is on).
    diag_time_bins: 16
    # IC-first curriculum for the diffusion physics-only objective. The constant
    # field T == T_right satisfies the PDE and every zero-Neumann wall, so a
    # residual-dominated start collapses to it before the IC anchor can fit the
    # per-sim initial fields (loss_r/loss_bc -> 0, loss_ic stuck, val ~ 100%).
    #
    # mode="ic_only" (legacy): fit the IC first with the residual/BC OFF, then ramp
    # them in.
    #   phase 1 (epoch < ic_only_epochs):  w_r = w_bc = 0, only lambda_ic active.
    #   phase 2 (ramp_epochs):             w_r, w_bc scale linearly 0 -> lambda_*.
    #   phase 3:                           all three at their lambda_* targets.
    #
    # mode="ic_heavy" (Chen et al.): keep the residual/BC ON but small through a
    # warm-up with a large lambda_ic, then decay lambda_ic while ramping the
    # residual/BC to their targets. The residual must see the IC-anchored field
    # from t=0 to propagate it, so it is never zeroed.
    #   phase 1 (epoch < warmup_epochs):   (warmup_lambda_r, lambda_ic, warmup_lambda_bc).
    #   phase 2 (decay_epochs):            lambda_ic -> lambda_ic_final; r/bc -> lambda_*.
    #   phase 3:                           (lambda_r, lambda_ic_final, lambda_bc).
    # enabled: false is a TRUE no-op (weights stay at the static lambda_* values).
    curriculum:
      enabled: false
      mode: ic_only
      ic_only_epochs: 0
      ramp_epochs: 1
      warmup_epochs: 0
      warmup_lambda_r: 0.1
      warmup_lambda_bc: 1.0
      decay_epochs: 1
      lambda_ic_final: 1.0
    # Causal residual weighting (Wang, Sankaran & Perdikaris 2022; Chen et al.):
    # bin the interior residual by query time and weight bin i by
    # exp(-eps_causal * sum_{j<i} L_j) so a later time is penalized only once the
    # earlier bins are resolved. Detached weights act as a mask. enabled: false is
    # a TRUE no-op (plain mean(r^2)).
    causal:
      enabled: false
      n_bins: 16
      eps_causal: 1.0
  run:
    run_dir: ${paths.runs_root}/${experiment.name}/config${config_id}
  # GradNorm-style adaptive balancing of the RAW per-component physics losses
  # (interior CN residual, left-Neumann, top/bottom adiabatic, right-Dirichlet,
  # IC, optional data). Each active term (positive static coefficient) gets a
  # multiplier w_t = mean(g)/g_t from its own gradient norm on the current step's
  # graph, EMA-smoothed by alpha_w and refreshed every update_every optimizer
  # steps. enabled: false is a TRUE no-op (multipliers stay 1.0, total is
  # bit-identical to the plain statically-weighted sum). Applies to both the
  # diffusion and forcing collocation physics-only regimes.
  gradnorm:
    enabled: false
    alpha_w: 0.9
    update_every: 10
    eps: 1.0e-8
  # Physics-informed FV-residual regularizer. The combined objective is
  #   L = lambda_data * L_data + lambda_physics * L_phys.
  # lambda_physics: 0.0 is a TRUE no-op: train.py must skip building the physics
  # loader, drawing a physics batch, and computing the residual entirely (not
  # multiply by zero), so the data stream / RNG order is byte-identical to today.
  physics:
    lambda_data: 1.0
    lambda_physics: 0.0
    # Linear physics-weight ramp: effective lambda_physics is scaled by
    # min(1, epoch / lambda_physics_ramp_epochs). 0 = no ramp (unchanged).
    lambda_physics_ramp_epochs: 0
    # Restrict the collocation source snapshot to grid times in
    # [collocation_source_time_min, collocation_source_time_max]. Both null =
    # legacy random source (byte-identical). A single pinned source is min==max.
    # Under a long-lead window the max feasible source is t_final - lead - dt, so
    # this range and the lead window are feasibility-coupled (see sampling below).
    collocation_source_time_min: null
    collocation_source_time_max: null
    # Lead sampling for the generic (forcing) collocation path:
    #   null  -> legacy uniform-lead draw over [max(dt, collocation_lead_min),
    #            cur_max_lead(epoch)] (may under-sample the longest leads).
    #   int N -> lead-bin-first: draw one of N equal-width bins over the active
    #            window uniformly, draw a lead inside it, then draw a source
    #            uniformly from those feasible (t_s + lead + dt <= t_final). Gives
    #            the hardest leads equal collocation mass, matching validation.
    collocation_lead_bins: null
    # Lower bound (seconds) on NON-bridge collocation leads so the residual sits
    # in the unlabeled band tau > tc. null = legacy dt lower bound.
    collocation_lead_min: null
    # Cutoff bridge: trusted state at the last supervised lead. When
    # anchor_lead_time is set, a fraction (anchor_fraction) of the collocation
    # batch is drawn as bridge rows enforcing R_FV(T_true(t_s + anchor_lead),
    # model(t_s + anchor_lead + dt)); the true cutoff snapshot (detached) is
    # injected as the residual's first state via the existing anchor mechanism.
    # null / 0.0 = no bridge rows (generic path unchanged).
    anchor_lead_time: null
    anchor_fraction: 0.0
    # Optional grad-balance diagnostic: two extra backwards on a few fixed
    # batches to log ||grad L_data||, ||grad L_phys|| and their cosine at step 0,
    # after the physics ramp, and near the end. Default off (not a training cost).
    log_grad_norms: false
    # IC/anchor loss weight pinning model(T_0, t=0) ~ T_0. Default OFF. REQUIRED
    # (> 0) for any diffusion physics/anchor run to break the constant-300
    # degeneracy: T == 300 satisfies the homogeneous PDE and every BC, so a
    # residual-only objective collapses to that field and ignores the IC.
    lambda_ic: 0.0
    # Source split for the W2 collocation sampler. "train" keeps val_rel_l2 an
    # honest held-out metric; "val" (transductive) is an explicit debug option.
    # forcing pins "val" in its benchmark group to keep its W2 path unchanged.
    collocation_source: train
    residual: interior          # interior | full_bc (full_bc is Stage 2)
    mode: one_step              # one_step (W1) | collocation (W2)
    dt: 0.005                   # one solver step (save_stride=1 spacing)
    physics_batch_size: null    # null -> reuse training.batch_size
    # Directory of the dedicated save_stride=1 physics dataset (consecutive
    # snapshots one solver step dt apart, CN-exact). The main data.data_dir set is
    # save_stride=2 (0.01 apart = two solver steps) and is INVALID for the one-step
    # residual, so the physics loader reads its own set. null -> reuse
    # paths.data_dir (only correct if that set itself was generated save_stride=1).
    data_dir: null
    # Collocation-lead curriculum (used only when mode=collocation). The sampler
    # draws collocation leads in [dt, current_max_lead(epoch)], ramping the max
    # lead from start to max over warmup epochs (optimization-stability device).
    collocation_lead_start: 0.01
    collocation_lead_max: 0.01
    collocation_lead_warmup_epochs: 0
    # ---- causal anchored physics-only knobs (diffusion collapse fix) ----
    # All default OFF so forcing/source/interfaces on-grid and generic
    # collocation paths stay byte-identical. Enabled only in the diffusion
    # benchmark group. Semantics use TARGET time: a collocation pair n->n+1 has
    # target (n+1)*dt, so a window "through max_target" maps to start indices
    # n in [0, max_start_step] with max_start_step = round(max_target/dt) - 1.
    #
    # anchored_first_step: on the (0->dt) pair, replace the model's T_n with the
    # EXACT normalized IC field (detached) so the residual can only be zeroed by
    # a genuine one-step diffusion of T_0 (breaks the constant-300 collapse).
    anchored_first_step: false
    # early_time_oversample: draw n from a 3-bucket mixture over [0, n_max]
    # instead of uniform, concentrating draws on the first few steps.
    early_time_oversample: false
    # early_band_steps: TARGET-time bound of the "first few steps" band in units
    # of dt. The early bucket covers targets 2*dt..early_band_steps*dt, i.e.
    # start indices n in {1..early_band_steps-1}.
    early_band_steps: 5
    # early_mix: bucket weights for the mixture (anchor={0}, early={1..band-1},
    # rest={band..n_max}); renormalized over non-empty buckets.
    early_mix:
      anchor: 0.4
      early: 0.4
      rest: 0.2
    # stratify_leads: on-grid-only block-structured lead coverage. Each batch
    # draws B // n_active base rows and, per base row, one CN interval from every
    # populated shared bin, so every bin sees the SAME sim-id/base-snapshot
    # multiset (a later bin's higher residual reflects lead, not harder inputs).
    # Mutually exclusive with early_time_oversample; raises on the generic/forcing
    # path (use collocation_lead_bins there). Intended diffusion recipe:
    # early_time_oversample=false stratify_leads=true.
    stratify_leads: false
    # stratify_bins: number of stratification bins. null inherits
    # causal_weighting.n_bins so stratification and causal weighting share one
    # TemporalBinSpec and never drift apart.
    stratify_bins: null
    # causal_weighting: residual-adaptive causal lead weighting of the INTERIOR
    # CN residual only (the BC/IC objectives stay separate). Weights per lead bin
    # are exp(-eps * exclusive_cumsum(bin_interior_loss)) so a late bin is
    # down-weighted until the earlier bins' residuals fall. Shares the Step-1
    # TemporalBinSpec (n_bins here also feeds stratify_bins when that is null).
    # Default OFF -> the collocation path is byte-identical. Works on both the
    # on-grid (diffusion) and generic (forcing) collocation paths.
    #   loss_history: current (paper-faithful, this step's global per-bin loss)
    #                 | ema (ablation, EMA of per-bin loss with ema_alpha).
    #   update_every: optimizer-step cadence for the epsilon schedule.
    #   eps grows (x eps_growth, capped eps_max) when the last ACTIVE bin's weight
    #     exceeds last_bin_threshold; shrinks (/eps_growth, floored eps_min) when
    #     the mean active-bin weight drops below mean_weight_floor and
    #     allow_eps_decrease; both gated on every active bin being populated.
    causal_weighting:
      enabled: false
      n_bins: 12
      eps: 1.0
      loss_history: current
      ema_alpha: 0.9
      update_every: 1
      eps_growth: 2.0
      eps_max: 100.0
      eps_min: 0.01
      allow_eps_decrease: true
      last_bin_threshold: 0.99
      mean_weight_floor: 0.5
    # warmup: IC-anchoring warm-up (PINO paper). For the first `steps` optimizer
    # steps, slow collocation resampling to every `resample_every` steps (freeze
    # both the drawn input functions and the query coordinates) and up-weight the
    # IC loss by `ic_multiplier` ON TOP OF the GradNorm weights, so the net first
    # learns a rough solution structure / anchors t=0 before the full per-step
    # stochasticity resumes. Progress tracked by a persistent global_optimizer_step
    # counter (checkpointed), not epoch*steps_per_epoch. Default OFF -> the
    # collocation path is byte-identical (no cache, IC multiplier 1). Paper ranges:
    # steps 50-2000, resample_every 50-100, ic_multiplier 2-10.
    warmup:
      enabled: false
      steps: 500
      resample_every: 50
      ic_multiplier: 5.0
    # causal_curriculum: fixed staged expansion of the sampled-time window.
    # Each stage has `epochs` (cumulative; final -1 = remainder) and exactly one
    # of `max_lead_steps` (int * dt) or `max_lead_frac` (fraction of t_final),
    # both expressing the max TARGET time of the window.
    causal_curriculum:
      enabled: false
      stages:
        - epochs: 20
          max_lead_steps: 5
        - epochs: 20
          max_lead_frac: 0.25
        - epochs: -1
          max_lead_frac: 1.0
    # full_bc per-region weights (default region-equal: each REGION contributes
    # equally, deliberately giving the few-celled boundary rows more influence
    # than a global mean(r_ij^2) would). Used only when residual=full_bc.
    full_bc_region_weights:
      interior: 1.0
      left_neumann: 1.0
      right_dirichlet: 1.0
      topbot_adiabatic: 1.0

data:
  t_grid_path: ${paths.data_dir}/t_grid.npy
  x_grid_path: ${paths.data_dir}/x_grid.npy
  y_grid_path: ${paths.data_dir}/y_grid.npy
  trajectories.npy: ${paths.data_dir}/trajectories.npy
  sim_params_path: ${paths.data_dir}/sim_params.npy
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  # x_shape / cond_static_shape / forcing_seq_shape / t_stats_shape are owned by
  # the active `benchmark` config group (per-benchmark representation).
  y_shape: "B, Nx, Ny, 1"
  num_sims: 8000
  # TRAIN-split lead/target truncation (long-lead OOD adaptation). Both null =
  # legacy full-pair train set (byte-identical). Applied ONLY to the train
  # dataset; val/test always span every lead so evaluation covers (0, t_final].
  #   train_max_lead_time:   drop train pairs with lead tau = t_j - t_s > this
  #                          (headline knob; e.g. 0.2 with t_final = 0.3).
  #   train_max_target_time: drop train pairs with absolute target t_j > this.
  # A +eps = 0.5*dt tolerance keeps a pair landing exactly on the cutoff.
  train_max_target_time: null
  train_max_lead_time: null
  # Optional windowed normalization horizon for a future absolute-time variant
  # (compute_global_stats restricts to snapshots with t <= norm_max_time). null
  # = full-trajectory stats (used by every long-lead run; no leakage under
  # lead-holdout since stats never expose the T(t_s) -> T(t_j) mapping).
  norm_max_time: null

evaluation:
  rollout:
    enabled: false
    num_substeps: 1
    partition: homogeneous

hydra:
  mode: MULTIRUN
  job:
    chdir: false
  run:
    dir: ${paths.runs_root}/${experiment.name}/single_run
  sweep:
    dir: ${paths.runs_root}/${experiment.name}/multirun
    subdir: ${hydra.job.num}
