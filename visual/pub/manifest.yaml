# Which runs and tables satisfy the requirement sets declared in figures.yaml.
#
# The four forward runs pair an MSI-trained checkpoint with a locally generated
# evaluation set drawn from RNG family 7 (data/pub_eval/*/meta.npy). Family 0 is
# what the checkpoints trained on, and the two families share no latent draw, so
# these sets are genuinely held out. This is not the same thing as the MSI test
# split, and the sidecars say so.
#
# Known, deliberate gaps -- every one of these surfaces as a Degradation rather
# than being papered over:
#   * one seed per benchmark, so no across-seed spread (TOO_FEW_SEEDS)
#   * sinusoidal Source + ITR and inverse runs must be supplied from MSI;
#     retired Gaussian artifacts are not interchangeable with these runs
#   * no *_train entries: learning curves are produced from the real MSI
#     training metrics, not from these checkpoints

sources:
  forcing_records:
    - run: runs/pub_forcing/config0/seed32
      seed: 32
      status: completed
  source_records:
    - run: runs/pub_source/config0/seed32
      seed: 32
      status: completed
  source_itr_sin_records: []
  interfaces_records:
    - run: runs/pub_interfaces_neumann_ic_v1/config0/seed32
      seed: 32
      status: completed

  forcing_checkpoint:
    - run: runs/pub_forcing/config0/seed32
  source_checkpoint:
    - run: runs/pub_source/config0/seed32
  source_itr_sin_checkpoint: []
  interfaces_checkpoint:
    - run: runs/pub_interfaces_neumann_ic_v1/config0/seed32

  inverse_forcing:
