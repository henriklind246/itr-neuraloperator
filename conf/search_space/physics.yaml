# @package search_space
params:
  # Physics-informed FV-residual weight. The minimal staged sweep (plan Stage 2)
  # uses a few values chosen after a one-off physics-vs-data gradient-magnitude
  # check, not a broad search.
  training.physics.lambda_physics: tag(log, interval(1e-3, 1.0))
  # PINO long-lead fine-tune knobs. Causal epsilon controls how sharply later
  # lead bins are suppressed until earlier bins converge; GradNorm alpha_w is the
  # multiplier EMA. Warm-up bounds are pinned to the PINO paper's ranges so a
  # sweep stays inside them (steps/resample_every/ic_multiplier only matter when
  # training.physics.warmup.enabled=true).
  training.physics.causal_weighting.eps: tag(log, interval(0.01, 100.0))
  training.gradnorm.alpha_w: interval(0.5, 0.99)
  training.physics.warmup.resample_every: int(interval(50, 100))
  training.physics.warmup.ic_multiplier: interval(2.0, 10.0)
  training.physics.warmup.steps: int(tag(log, interval(50, 2000)))
