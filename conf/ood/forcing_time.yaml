# OOD suite descriptor for the time-extrapolation axis (forcing benchmark).
#
# See conf/ood/forcing.yaml for the schema. `time` is an evaluation_parameter
# axis: ONE extended trajectory is generated per repeat (solved to
# dataset_t_final), and the eval stage expands it into target-time buckets under
# the three pair protocols. The dataset keeps the true physical horizon (0.45);
# the trained normalization horizon (0.30) is threaded ONLY into the temporal
# model-input features, so any target past 0.30 yields lead/time features > 1.0.
# Run against the same trained run_root as the in-distribution checkpoint.

benchmark: forcing
representation: temporal_encoder
repeats: 4

axes:
  - name: time
    dataset_t_final: 0.45
    time_norm_horizon: 0.30
    target_times: [0.25, 0.30, 0.35, 0.40, 0.45]
    protocols: [fixed_initial, anchored_from_horizon, ood_local_fixed_lead]
