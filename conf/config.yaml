# YAML file for data paths and hyperparameters

defaults:
  - paths: default
  - search_space: medium
  - override hydra/sweeper: optuna_local
  - _self_

config_id: 0

experiment:
  name: ${oc.env:EXPERIMENT_NAME,experiment0}

tuning:
  n_trials: 5
  direction: minimize
  objective: best_val_mean

model:
  type: 2D FNO
  parameters:
    modes1: 16
    modes2: 16
    width: 64
    in_channels: 15
    out_channels: 1
    layers: 4
    activation: "Tanh"

training:
  k: 10
  H: 40
  device: "auto"
  batch_size: 10
  epochs: 1500
  learning_rate: 0.001
  weight_decay: 1.0e-5
  scheduler:
    step_size: 50
    gamma: 0.5
  optimizer: "Adam"
  loss_function: "MSELoss"
  validate_every: 10
  patience: 15
  checkpoint_metric: "val_rel_l2"
  seeds: [0, 1]
  run:
    run_dir: ${paths.runs_root}/${experiment.name}/config${config_id}

evaluation:
  validation:
  test:

data:
  t_grid_path: ${paths.data_dir}/t_grid.npy
  x_grid_path: ${paths.data_dir}/x_grid.npy
  trajectories.npy: ${paths.data_dir}/trajectories.npy
  sim_params_path: ${paths.data_dir}/sim_params.npy
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  x_shape: "samples, Nx, H, 15"
  y_shape: "samples, Nx, H, 1"

hydra:
  mode: MULTIRUN
  job:
    chdir: false
  run:
    dir: ${paths.runs_root}/${experiment.name}/single_run
  sweep:
    dir: ${paths.runs_root}/${experiment.name}/multirun
    subdir: ${hydra.job.num}
