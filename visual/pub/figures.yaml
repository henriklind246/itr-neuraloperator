# What each publication figure requires. Version controlled.
#
# This file is the requirement side only. Which concrete runs satisfy a
# requirement set is declared in manifest.yaml (user supplied); how a figure is
# drawn is declared in registry.py. `python -m visual.pub --verify` joins the
# three and prints the satisfiability table.
#
# kind: test_records | train_metrics | ood_per_sim | inverse_csv | checkpoint
#       | json_report | none

version: 1

requirement_sets:

  # ---------------------------------------------------------------- forward
  forcing_records:
    kind: test_records
    benchmarks: [forcing]
    representation: temporal_encoder
    split: test
    min_seeds: 3
    schema_min: 2
    regenerate: >-
      python scripts/run_train_fixed.py experiment.name=pub_forcing
      benchmark=forcing representation=temporal_encoder ; then
      python scripts/write_test_records.py runs/pub_forcing/config0 --seed <s>

  source_records:
    kind: test_records
    benchmarks: [source]
    representation: temporal_encoder
    split: test
    min_seeds: 3
    schema_min: 2
    regenerate: >-
      python scripts/run_train_fixed.py experiment.name=pub_source
      benchmark=source representation=temporal_encoder ; then
      python scripts/write_test_records.py runs/pub_source/config0 --seed <s>

  source_itr_sin_records:
    kind: test_records
    benchmarks: [source_itr_sin]
    representation: temporal_encoder
    split: test
    min_seeds: 3
    schema_min: 2
    regenerate: >-
      python scripts/run_train_fixed.py experiment.name=pub_source_itr_sin
      benchmark=source_itr_sin representation=temporal_encoder ; then
      python scripts/write_test_records.py runs/pub_source_itr_sin/config0 --seed <s>

  interfaces_records:
    kind: test_records
    benchmarks: [interfaces]
    representation: temporal_encoder
    split: test
    min_seeds: 3
    schema_min: 2
    regenerate: >-
      python scripts/run_train_fixed.py experiment.name=pub_interfaces
      benchmark=interfaces representation=temporal_encoder ; then
      python scripts/write_test_records.py runs/pub_interfaces/config0 --seed <s>

  # ---------------------------------------------------------------- training
  forcing_train:
    kind: train_metrics
    benchmarks: [forcing]
    min_seeds: 3
    note: normalized-space metrics only; never co-plotted with Kelvin.

  source_train:
    kind: train_metrics
    benchmarks: [source]
    min_seeds: 3

  source_itr_sin_train:
    kind: train_metrics
    benchmarks: [source_itr_sin]
    min_seeds: 3

  interfaces_train:
    kind: train_metrics
    benchmarks: [interfaces]
    min_seeds: 3

  # ---------------------------------------------------------- field rendering
  forcing_checkpoint:
    kind: checkpoint
    benchmarks: [forcing]
    min_seeds: 1

  source_checkpoint:
    kind: checkpoint
    benchmarks: [source]
    min_seeds: 1

  source_itr_sin_checkpoint:
    kind: checkpoint
    benchmarks: [source_itr_sin]
    min_seeds: 1
    note: >-
      needed to render predicted fields and the contact jump; the signature
      figure evaluates the model, it does not read a precomputed field.

  interfaces_checkpoint:
    kind: checkpoint
    benchmarks: [interfaces]
    min_seeds: 1

  # ----------------------------------------------------------------- inverse
  inverse_forcing:
    kind: inverse_csv
    benchmarks: [forcing]
    min_seeds: 1
    schema_min: 0
    required_columns: [sim_id, n_sensors]
    regenerate: python scripts/invert.py --benchmark forcing ...

  inverse_forcing_itr_sin:
    kind: inverse_csv
    benchmarks: [forcing_itr_sin]
    min_seeds: 1
    schema_min: 0
    required_columns: [sim_id]
    regenerate: python scripts/invert.py --benchmark forcing_itr_sin ...

  inverse_sensor_sweep:
    kind: inverse_csv
    benchmarks: [forcing, forcing_itr_sin]
    min_seeds: 1
    schema_min: 0
    required_columns:
      - benchmark
      - sim_id
      - n_sensors
      - noise_seed
      - init_seed
      - noise_std_K
      - fv_resid_rms_K
      - fv_resid_over_noise
    note: >-
      requires exactly 8, 16, and 32 sensors with the same eight simulations,
      noise realizations, and initialization seeds paired across counts for both
      forcing and forcing_itr_sin. Per-benchmark estimate columns (R_c_map, or
      R_base_hat and A_hat) are validated conditionally at load time rather than
      listed above, because the two benchmarks may be supplied as separate CSVs
      and neither carries the other's columns. F29 and F30 additionally read the
      per-sim NPZ artifacts beside each CSV
      (sensors_NN/artifacts/sim_NNNNN.npz, schema >= 3); F30 needs the joint NLL
      grid that --joint-nll-grid writes and falls back to a quadratic
      approximation, labelled as such, when only the sensitivity is stored.
    regenerate: >-
      python scripts/run_inverse_sensor_sweep.py --benchmark <forcing|forcing_itr_sin>
      --checkpoint <matching-checkpoint>

  # --------------------------------------------------------------------- ood
  ood_time:
    kind: ood_per_sim
    min_seeds: 3
    schema_min: 0
    required_columns: [protocol, sim_id]
    regenerate: python scripts/run_ood_suite.py ...   # once per model seed

  ood_transfer:
    kind: ood_per_sim
    min_seeds: 3
    schema_min: 0
    required_columns: [ood_axis, ood_value, sim_id]
    regenerate: python scripts/run_ood_suite.py ...   # once per model seed

  # ------------------------------------------------------------- conditional
  rollout_records:
    kind: test_records
    benchmarks: [forcing, source, interfaces]
    representation: temporal_encoder
    min_seeds: 1
    schema_min: 4
    required_columns:
      - provenance_id
      - sim_id
      - s
      - j
      - lead_time_actual
      - sse_K2
      - target_sse_K2
    note: >-
      pair-aligned direct and homogeneous K={2,4,8} rollout records for the
      forcing, source, and current interfaces studies.
    regenerate: python scripts/run_rollout_study.py ...

  resinv_reports:
    kind: json_report
    min_seeds: 1
    schema_min: 0
    note: >-
      E32 original and E33 material-side seed_report_r*.json ladders, their
      study manifests, and the checkpoint-normalized FV drift baseline.
    regenerate: >-
      python scripts/fv_convergence_baseline.py ... and the per-resolution
      evaluation reports

figures:

  F01_problem_schematic:
    requires: []
    metric_space: none

  F02_architecture:
    requires: []
    metric_space: none

  F03_learning_curves:
    requires: [forcing_train, source_train, source_itr_sin_train, interfaces_train]
    metric_space: normalized

  F04_headline_accuracy:
    requires: [forcing_records, source_records, source_itr_sin_records, interfaces_records]
    # mixed: three Kelvin panels plus one normalized panel carrying the 1%
    # target line. The target is defined on relative L2, so it cannot be drawn
    # on a Kelvin axis; each panel is a single metric and is labelled with its
    # own space.
    metric_space: mixed

  F05_truth_pred_residual:
    requires:
      - forcing_records
      - source_records
      - source_itr_sin_records
      - interfaces_records
      - forcing_checkpoint
      - source_checkpoint
      - source_itr_sin_checkpoint
      - interfaces_checkpoint
    metric_space: kelvin

  # interfaces, not source_itr_sin: the signature figure shares one temperature
  # scale across truth and prediction, and under a localized internal source the
  # right slab never rises past ~9% of the left, so half of every source /
  # source_itr_sin panel would be one flat block. See PREFERRED in fig_signature.py.
  F06_signature:
    requires: [interfaces_records, interfaces_checkpoint]
    metric_space: kelvin

  F07_jump_vs_lead:
    requires: [forcing_records, source_records, source_itr_sin_records, interfaces_records]
    metric_space: mixed

  F08_forcing_difficulty:
    requires: [forcing_records]
    metric_space: kelvin

  F09_forcing_cases:
    requires: [forcing_records, forcing_checkpoint]
    metric_space: kelvin

  F10_source_difficulty:
    requires: [source_records]
    metric_space: kelvin

  F11_source_cases:
    requires: [source_records, source_checkpoint]
    metric_space: kelvin

  F12_source_itr_sin_resistance:
    requires: [source_itr_sin_records]
    metric_space: kelvin

  F13_source_itr_sin_cases:
    requires: [source_itr_sin_records, source_itr_sin_checkpoint]
    metric_space: kelvin

  F14_interfaces_difficulty:
    requires: [interfaces_records]
    metric_space: kelvin

  F15_interfaces_profiles:
    requires: [interfaces_records, interfaces_checkpoint]
    metric_space: kelvin

  F16_inverse_forcing_recovery:
    requires: [inverse_forcing]
    metric_space: mixed

  F17_inverse_forcing_itr_sin:
    requires: [inverse_forcing_itr_sin]
    metric_space: mixed

  F18_sensor_count:
    requires: [inverse_sensor_sweep]
    metric_space: mixed

  F19_ood_time_protocols:
    requires: [ood_time]
    # mixed: relative L2 carries the protocol comparison across two orders of
    # magnitude, where a Kelvin axis compresses the two controlled protocols
    # onto the baseline; the interface panel is Kelvin. Each panel is a single
    # metric and is labelled with its own space.
    metric_space: mixed

  F20_ood_transfer:
    requires: [ood_transfer]
    # relative L2 throughout, defined as a ratio of Kelvin sums, so the three
    # shift axes stay comparable despite different absolute temperature scales.
    metric_space: normalized

  F21_tail_reliability:
    requires: [forcing_records, source_records, source_itr_sin_records, interfaces_records]
    # mixed: Kelvin order statistics plus the exceedance of the 1% relative
    # target, which is the only threshold the project has actually declared.
    metric_space: mixed

  F22_surrogate_fidelity:
    requires: [inverse_forcing]
    metric_space: mixed

  F23_direct_vs_autoregressive:
    requires: [rollout_records]
    metric_space: normalized

  F24_resolution_invariance:
    requires: [resinv_reports]
    metric_space: normalized

  F25_mms_convergence:
    requires: []
    metric_space: none

  F26_contact_jump_vs_lead:
    requires:
      - forcing_records
      - source_records
      - source_itr_sin_records
      - interfaces_records
      - forcing_checkpoint
      - source_checkpoint
      - source_itr_sin_checkpoint
      - interfaces_checkpoint
    metric_space: kelvin

  F27_global_field_error_vs_lead:
    requires: [forcing_records, source_records, source_itr_sin_records, interfaces_records]
    metric_space: kelvin

  F28_global_field_error_vs_itr:
    requires: [forcing_records, source_records, source_itr_sin_records, interfaces_records]
    metric_space: kelvin

  F29_inverse_rc_profile_recovery:
    requires: [inverse_sensor_sweep]
    # kelvin is this vocabulary's physical-units bucket; the actual unit here is
    # m^2 K/W on the R_c axis, as it is for F28. Nothing is normalized or
    # expressed as a ratio.
    metric_space: kelvin

  F30_inverse_identifiability:
    requires: [inverse_sensor_sweep]
    # mixed: the parameter axes are physical, the vertical axis is a
    # dimensionless log-likelihood difference against a chi-squared threshold.
    metric_space: mixed
