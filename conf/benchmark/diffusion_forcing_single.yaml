# @package _global_
# Single-slab, forcing-driven diffusion benchmark restricted to the sin/uniform
# forcing family. Identical physics to diffusion_forcing (one homogeneous slab
# k = rho = cp = 1 so alpha = 1, fixed uniform 300 K initial condition, right
# Dirichlet wall at 300 K, adiabatic top/bottom, inhomogeneous left-wall Neumann
# flux q_L(y, t) = a(t) * s(y)), but the forcing family is locked to the sin
# temporal profile and uniform spatial profile so only the sinusoid amplitude and
# frequency vary per simulation (matching the interfaces benchmark's forcing
# setup, without the interface). Only the temporal_encoder representation is
# supported.
#
# This is a capability/isolation probe for the ForcingCViT image/PINO path: the
# saved FV validation set is single-family (pinned by the spec schema), and the
# online training sampler is pinned to sin/uniform via training.pino.forcing.

benchmark:
  name: diffusion_forcing_single

training:
  learning_rate: 5.0e-4
  scheduler:
    type: PICViTExponential
    decay_every: 500
    decay_rate: 0.95
    min_lr: 1.0e-5
  loss:
    # Single homogeneous slab has no interface; interface_weight = 1.0 -> plain
    # MSE and a 2-dim T_stats keeps the no-interface loss path clean.
    interface_weight: 1.0
    per_sample_interface_x: false
  physics:
    mode: collocation
    # Train the collocation sampler on training sims so val_rel_l2 stays honest.
    collocation_source: train
    # OFF by default so a data-only smoke run stays pure data. Set =1.0 on the CLI
    # for any physics/anchor run to anchor the fixed 300 K IC.
    lambda_ic: 0.0
  pino:
    forcing:
      # Lock the online training sampler to the single sin/uniform family so it
      # matches the pinned single-family FV validation set.
      temporal_family: sin
      spatial_family: uniform
