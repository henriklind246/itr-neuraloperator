[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "no-tps-ihcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "torch==2.7.0",
    "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data*"]
