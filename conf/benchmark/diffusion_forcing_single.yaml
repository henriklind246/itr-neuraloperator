# @package _global_
# Single-slab, forcing-driven diffusion benchmark restricted to the sin/uniform
# forcing family, with a VARYING initial condition. Identical physics to
# diffusion_forcing (one homogeneous slab k = rho = cp = 1 so alpha = 1, right
# Dirichlet wall at 300 K, adiabatic top/bottom, inhomogeneous left-wall Neumann
# flux q_L(y, t) = a(t) * s(y)), and the forcing family stays locked to the sin
# temporal profile and uniform spatial profile so only the sinusoid amplitude and
# frequency vary per simulation. The ONE change from the constant-IC probe: the
# initial condition is sampled per sim across all four IC families (uniform_2d,
# random_sinusoid_2d, grf_2d, hot_spot_2d) instead of a fixed uniform 300 K field.
#
# A varying IC is invisible in the forcing image, so the surrogate is a two-branch
# ForcingICCViT (variant forcing_ic): one encoder over the forcing space-time
# image, a second over the per-sim IC field, fused in the decoder cross-attention.
# Trained physics-only (PINO) with a selectable autodiff or finite-volume main
# residual and an IC anchor targeting the SAMPLED T0 (not a constant 300 K).
# The saved FV validation set is single-family (sin/uniform) with varying ICs;
# the online training sampler is pinned to sin/uniform via training.pino.forcing.

benchmark:
  name: diffusion_forcing_single

training:
  learning_rate: 5.0e-4
  scheduler:
    type: PICViTExponential
    decay_every: 500
    decay_rate: 0.95
    min_lr: 1.0e-5
  loss:
    # Single homogeneous slab has no interface; interface_weight = 1.0 -> plain
    # MSE and a 2-dim T_stats keeps the no-interface loss path clean.
    interface_weight: 1.0
    per_sample_interface_x: false
  physics:
    mode: collocation
    # The PINO optimizer samples complete IC/forcing problems online; saved
    # trajectories remain the fixed validation and normalization reference.
    collocation_source: online
    # Anchor the sampled (now varying) IC. The forcing_ic runner reads the IC
    # anchor weight from training.pino.lambda_ic (default 1.0); this mirrors the
    # intent for the non-forcing collocation path and documents that the IC is
    # anchored, not free.
    lambda_ic: 1.0
    # IC anchor node budget: sample this many exact grid nodes per step and gather
    # targets from the same transferred normalized IC buffer seen by the encoder.
    n_ic_points: 1024
  pino:
    # The two-branch ForcingICCViT is the only compatible surrogate; the dispatch
    # asserts this so an old ForcingCViT ("forcing") config cannot silently ignore
    # the varying IC.
    variant: forcing_ic
    # Select "finite_volume" for full-grid solver-lattice CN collocation.
    residual_method: autodiff
    forcing:
      # Lock the online training sampler to the single sin/uniform family so it
      # matches the pinned single-family FV validation set.
      temporal_family: sin
      spatial_family: uniform
