# Interfaces benchmark: fixed sin/uniform forcing, interface_x sampled in
# [0.2, 0.8]. All tensor dims (in_channels, cond_static_dim,
# temporal_token_dim, s_y_channel, use_forcing_time_aug) are resolved by the
# benchmark's ProblemSpec, not declared here.

benchmark:
  name: interfaces

training:
  loss:
    interface_x: 0.5
    interface_half_width: 0.05
    interface_weight: 10.0
    # interface_x varies per sim in [0.2, 0.8]; track each sample's location for
    # the weighted loss and interface metric instead of the fixed interface_x.
    per_sample_interface_x: true
