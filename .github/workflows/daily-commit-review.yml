name: Daily Commit Review

on:
  schedule:
    # 3am UTC = 9pm US Central (CST). During CDT this fires at 10pm CT.
    - cron: '0 3 * * *'
  workflow_dispatch: # Manual trigger for testing

permissions:
  issues: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CI dependencies
        run: pip install -r .github/scripts/requirements-ci.txt

      - name: Run daily commit review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          REVIEW_TIMEZONE: 'America/Chicago'
        run: python .github/scripts/daily_commit_review.py
