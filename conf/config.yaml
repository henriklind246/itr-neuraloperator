defaults:
  - paths: default
  - search_space: medium
  - override hydra/sweeper: optuna_local
  - _self_

config_id: 0

experiment:
  name: ${oc.env:EXPERIMENT_NAME,experiment0}

tuning:
  n_trials: 50
  direction: minimize
  objective: best_val_mean

model:
  type: "1D FNO time-conditioned"
  parameters:
    modes: 16
    width: 64
    in_channels: 2
    out_channels: 1
    n_layers: 4
    cond_dim: 4
    cond_hidden: 256
    activation: "GELU"

training:
  device: "auto"
  batch_size: 64
  pairs_per_sim_train: 50
  pairs_per_sim_val: 20
  test_stride: 1
  epochs: 1500
  learning_rate: 0.001
  weight_decay: 1.0e-5
  scheduler:
    step_size: 50
    gamma: 0.5
  optimizer: "Adam"
  loss:
    interface_x: 0.5
    interface_half_width: 0.05
    interface_weight: 10.0
  validate_every: 10
  patience: 15
  checkpoint_metric: "val_rel_l2"
  seeds: [0, 1]
  run:
    run_dir: ${paths.runs_root}/${experiment.name}/config${config_id}

data:
  t_grid_path: ${paths.data_dir}/t_grid.npy
  x_grid_path: ${paths.data_dir}/x_grid.npy
  trajectories.npy: ${paths.data_dir}/trajectories.npy
  sim_params_path: ${paths.data_dir}/sim_params.npy
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  x_shape: "B, Nx, 2"
  y_shape: "B, Nx, 1"
  cond_shape: "B, 4"
  t_stats_shape: "B, 2"

hydra:
  mode: MULTIRUN
  job:
    chdir: false
  run:
    dir: ${paths.runs_root}/${experiment.name}/single_run
  sweep:
    dir: ${paths.runs_root}/${experiment.name}/multirun
    subdir: ${hydra.job.num}
