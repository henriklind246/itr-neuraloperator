# @package search_space
params:
  # --- Training optimization (3 params) ---
  training.learning_rate: tag(log, interval(5e-5, 1e-2))
  training.weight_decay: tag(log, interval(1e-7, 1e-3))
  training.batch_size: choice(128, 256, 512, 1024)

  # --- Model architecture (4 params) ---
  model.parameters.modes1: choice(8, 12, 16, 20, 24, 32)
  model.parameters.modes2: choice(8, 12, 16, 20, 24, 32)
  model.parameters.width: choice(32, 48, 64, 96)
  model.parameters.n_layers: choice(2, 3, 4, 5, 6)
  model.parameters.cond_hidden: choice(64, 128, 256, 384)

  # --- Loss function (2 params) ---
  training.loss.interface_weight: tag(log, interval(1.0, 50.0))
  training.loss.interface_half_width: choice(0.02, 0.04, 0.06, 0.10)

  # --- Data sampling (2 params) ---
  training.n_snapshots: choice(10, 15, 20, 25)
  training.curriculum_warmup: choice(0, 25, 50, 100)
