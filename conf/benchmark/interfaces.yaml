# @package _global_
# Interfaces benchmark: fixed sin/uniform forcing, interface_x sampled in
# [0.2, 0.8]. 6 spatial channels [T_tilde, x, y, K_norm, D_norm, s_y], 4 static
# cond dims, (64, 5) forcing_seq, temporal encoder on, 3-dim T_stats whose slot
# 2 carries interface_x. This file owns the representational dims so
# `benchmark=interfaces` is the single source of truth for them.

benchmark:
  name: interfaces

model:
  parameters:
    in_channels: 6
    cond_static_dim: 4
    temporal_token_dim: 5
    use_temporal_encoder: true

data:
  x_shape: "B, Nx, Ny, 6"
  cond_static_shape: "B, 4"
  forcing_seq_shape: "B, 64, 5"
  t_stats_shape: "B, 3"

training:
  loss:
    interface_x: 0.5
    interface_half_width: 0.05
    interface_weight: 10.0
