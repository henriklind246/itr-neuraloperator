# @package _global_
# Single-slab, forcing-driven diffusion benchmark. One homogeneous slab
# (k = rho = cp = 1, so alpha = 1), fixed uniform 300 K initial condition, right
# Dirichlet wall at 300 K, adiabatic top/bottom, and an inhomogeneous left-wall
# Neumann flux q_L(y, t) = a(t) * s(y) (the forcing families in
# src/physics/boundary_forcing.py). No interface, no contact resistance. Only the
# temporal_encoder representation is supported.
#
# Physics-only (PINO) training conditions the ForcingCViT encoder on the forcing
# image (the per-sim signal), NOT the initial condition, which is constant here.
# The left wall carries the forcing residual dT_tilde/dx|_{x=0} + q_L/(k*sigma);
# the fixed 300 K IC is still anchored by the soft IC term (set lambda_ic > 0 on
# the CLI, e.g. 1.0, for ANY physics/anchor run).

benchmark:
  name: diffusion_forcing

training:
  loss:
    # Single homogeneous slab has no interface; interface_weight = 1.0 -> plain
    # MSE and a 2-dim T_stats keeps the no-interface loss path clean.
    interface_weight: 1.0
    per_sample_interface_x: false
  physics:
    mode: collocation
    # Train the collocation sampler on training sims so val_rel_l2 stays honest.
    collocation_source: train
    # OFF by default so a data-only smoke run stays pure data. Set =1.0 on the CLI
    # for any physics/anchor run to anchor the fixed 300 K IC.
    lambda_ic: 0.0
