# Source benchmark: internal volumetric chip-heating patch, interface fixed at
# x = 0.5. All representation-determined tensor dims (in_channels,
# cond_static_dim, temporal_token_dim, use_temporal_encoder, s_y_channel,
# use_forcing_time_aug) are resolved by the ProblemSpec from the
# (benchmark, representation) pair, not declared here.

benchmark:
  name: source
  # Spatial-descriptor conditioning ablation (masks cond_static, leaves the
  # spatial channel intact; cond_static_dim unchanged). source has no one-hot
  # family label, so no_family is a no-op (== full):
  #   full                - baseline; nothing masked.
  #   spatial_field_only  - zero the patch-geometry descriptor [x_h, y_h, w_h, h_h].
  spatial_conditioning: full

training:
  loss:
    interface_x: 0.5
    interface_half_width: 0.03
    interface_weight: 15.0
    # Interface fixed at x = 0.5; use the static weight band/metric.
    per_sample_interface_x: false
