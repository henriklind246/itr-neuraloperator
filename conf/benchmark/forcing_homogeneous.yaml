benchmark:
  name: forcing_homogeneous
  representation: temporal_encoder

training:
  batch_size: 1
  learning_rate: 0.001
  optimizer: SOAP
  weight_decay: 0.0
  grad_clip: 1.0
  soap:
    max_precond_dim: 2048
  loss:
    interface_weight: 1.0
    interface_x: 0.5
    interface_half_width: 0.05
    per_sample_interface_x: false
  scheduler:
    type: PICViTExponential
    decay_every: 250
    decay_rate: 0.90
    min_lr: 0.00001

physics_test:
  model_type: cvit
  pino:
    residual_mode: autoregressive
    prefix_steps: 60
    controls: [mg]
    ic_weight: 0.0
    # A uniform IC and startup ramp make the first-step copy baseline nearly exact.
    gate_compare_first_step_baselines: false
    batch_size: 1
    online_updates: 5000
    online_sampling: per_update
    online_validate_every: 500
    full_validate_every: 1000
    validation_cases: 32
    validation_rollout_steps: 60
    validation_batch_size: 1
    compact_metrics: true
    checkpoint_keep_all: false
    log_every: 50
